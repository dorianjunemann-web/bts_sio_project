<!DOCTYPE html>
<html lang = "fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inscription Nouveau Client - Méditerranée</title>
	<link rel="stylesheet" href="style.css">
</head>
<body bgcolor= "red">


<header>
	<h1>Inscription d'un Nouveau client</h1>
</header>

<section>
	

	<form action="https://dorianjunemann-web.github.io/bts_sio_project/projet_5/inscription.html" method="post">
	<table border="0">
		<tbody>

		<tr>
<td> <label for="nom">Nom:</label> </td> 
<td> <input type="text" id="nom" name="nom"> </td>

		</tr>
		<tr>

<td> <label for="prenom">Prénom :</label> </td>
<td> <input type="text" id="prenom" name="prenom"></td>


</tr>
<tr>

<td> <label for="date_naissance">Date de naissance :</label> </td>
<td> <input type="date" id="date_naissance" name="date_naissance"> </td>


</tr>
<tr>

<td> <label for="email">Adresse mail:</label> </td>
<td> <input type="email" id="email" name="email"> </td>


</tr>
<tr>

<td> <label for="mdp">Mot de passe:</label></td>
<td> <input type="password" id="mdp" name="mdp"></td>


</tr>
<tr>

<td><label for="permis">Numéro de permis :</label></td>
<td><input type= "text" id="permis" name="permis"></td>


</tr>
<tr>

<td><label for="anciennete">Nombre d'années d'ancienneté :</label></td>
<td><input type="number" id="anciennete" name="anciennete" min="0" max="80"></td>


</tr>

<tr></tr>
<tr></tr>
<tr></tr>

<tr>

<td><label for= "ville">Ville :</label></td>
<td><select id="ville" name="ville">
	<option value="paris">Paris</option>
	<option value="versailles">Versailles</option>
	<option value="creteil">Créteil</option>
</select> 


</tr>

<tr></tr>
<tr></tr>
<tr></tr>

<tr>

<td><label for="adresse">Adresse du client:</label></td>
<td><textarea id="adresse" name="adresse" rows="4" cols="30"></textarea></td>
<br>

</tr>

<tr>
    <td><label for="situation" >Situation<br>matrimoniale :


       <td><label>Marié :</label>
       <input type="radio" name="situation"></td>
    

    
      <td><label>Non marié :</label>

        <input type="radio" name="situation"></td>
</tr>

<tr>
	<td><label for="voiture">Préference de voiture:</label></td>
	<td><label for="pref_auto">Automatique :</label></td>
	<td><label for="pref_manuelle">Manuelle :</label></td>
</tr>

<tr>
<td><p></p></td>
<td><input type="checkbox" id="pref_auto" name="preference_auto"
value="automatique"></td>
<td><input type="checkbox" id="pref_manuelle" name="preference_manuelle"
value="manuelle"></td>

</tr>

</tbody></table>

<br>
<br>
<button type="submit">Enregistrer</button>
<button type= "reset">Annuler</button>

	</form>
</section>
<footer>
	<p>&copy; 2026 Agence Méditerranée - Location de véhicules</p>

</footer>
</body>
</html>
